name: Sync YouTube portfolio

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-youtube-portfolio
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout portfolio
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install image tooling
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Sync selected YouTube playlist
        run: python scripts/sync-youtube.py --sync

      - name: Commit synchronized catalog
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/data/projects.json assets/js/app.js assets/img/thumbnails
          if git diff --cached --quiet; then
            echo 'No YouTube portfolio changes.'
            exit 0
          fi
          git commit -m 'chore: sync YouTube portfolio'
          git push
