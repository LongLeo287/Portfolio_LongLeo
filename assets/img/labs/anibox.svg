<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">AniBox — Android TV media experience</title>
  <desc id="desc">Dark media dashboard with a gold AniBox wordmark, remote navigation hint and anime content cards.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08090d"/>
      <stop offset="0.55" stop-color="#151114"/>
      <stop offset="1" stop-color="#3a1d14"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5bd52" stop-opacity=".9"/>
      <stop offset="1" stop-color="#d86b2a" stop-opacity=".1"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="34"/></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1000" cy="110" r="190" fill="#d86b2a" opacity=".34" filter="url(#blur)"/>
  <circle cx="210" cy="520" r="220" fill="#f5bd52" opacity=".12" filter="url(#blur)"/>
  <rect x="74" y="72" width="1052" height="486" rx="28" fill="#0b0c11" fill-opacity=".76" stroke="#f5bd52" stroke-opacity=".22"/>
  <text x="116" y="148" fill="#f5bd52" font-family="Arial, sans-serif" font-size="25" font-weight="700" letter-spacing="4">ANDROID TV · TV BOX</text>
  <text x="112" y="240" fill="#fff8e6" font-family="Arial, sans-serif" font-size="78" font-weight="800">AniBox</text>
  <text x="118" y="288" fill="#c9c5bd" font-family="Arial, sans-serif" font-size="26">Mọi thứ để xem. Một remote là đủ.</text>
  <rect x="116" y="351" width="250" height="118" rx="16" fill="url(#glow)" opacity=".8"/>
  <rect x="390" y="351" width="250" height="118" rx="16" fill="#252027"/>
  <rect x="664" y="351" width="250" height="118" rx="16" fill="#302128"/>
  <path d="M138 438h205M412 438h205M686 438h205" stroke="#fff8e6" stroke-opacity=".22" stroke-width="7" stroke-linecap="round"/>
  <circle cx="1030" cy="427" r="42" fill="#fff8e6" fill-opacity=".08" stroke="#f5bd52" stroke-opacity=".7"/>
  <circle cx="1030" cy="427" r="10" fill="#f5bd52"/>
  <path d="M1030 371v-24M1030 507v-24M974 427h-24M1086 427h-24" stroke="#f5bd52" stroke-width="6" stroke-linecap="round" opacity=".8"/>
  <text x="116" y="520" fill="#9b9690" font-family="Arial, sans-serif" font-size="20">Anime · phim · truyền hình trực tiếp · phụ đề Việt</text>
</svg>
